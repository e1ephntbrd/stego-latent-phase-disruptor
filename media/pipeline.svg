<svg xmlns="http://w3.org" viewBox="0 0 1350 420" width="100%" height="100%" style="background:#0a0d14; font-family:'Segoe UI', sans-serif;">
  <defs>
    <linearGradient id="blue-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3776AB"/><stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <linearGradient id="purple-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EE4C2C"/><stop offset="100%" stop-color="#b180ff"/>
    </linearGradient>
    <linearGradient id="pink-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD21E"/><stop offset="100%" stop-color="#ff7ec3"/>
    </linearGradient>
  </defs>

  <line x1="90" y1="210" x2="210" y2="210" stroke="#1a2333" stroke-width="6"/>
  <line x1="90" y1="210" x2="210" y2="210" stroke="url(#blue-cyan)" stroke-width="3" stroke-dasharray="6,6"/>

  <line x1="470" y1="210" x2="550" y2="210" stroke="#1a2333" stroke-width="6"/>
  <line x1="470" y1="210" x2="550" y2="210" stroke="url(#blue-cyan)" stroke-width="3" stroke-dasharray="6,6"/>

  <line x1="810" y1="210" x2="890" y2="210" stroke="#1a2333" stroke-width="6"/>
  <line x1="810" y1="210" x2="890" y2="210" stroke="url(#purple-pink)" stroke-width="3" stroke-dasharray="6,6"/>

  <line x1="1150" y1="210" x2="1250" y2="210" stroke="#1a2333" stroke-width="6"/>
  <line x1="1150" y1="210" x2="1250" y2="210" stroke="url(#pink-orange)" stroke-width="3" stroke-dasharray="6,6"/>

  <g>
    <circle cx="90" cy="210" r="40" fill="#111520" stroke="#3776AB" stroke-width="2.5"/>
    <text x="90" y="214" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">INPUT</text>
    <text x="90" y="270" fill="#50677f" font-size="11" text-anchor="middle">SynthID File</text>
  </g>

  <g>
    <rect x="210" y="125" width="260" height="170" rx="12" fill="#111520" stroke="url(#blue-cyan)" stroke-width="2.5"/>
    <rect x="210" y="125" width="260" height="35" rx="12" fill="url(#blue-cyan)" opacity="0.15"/>
    <text x="340" y="148" fill="#00f2fe" font-size="14" font-weight="bold" text-anchor="middle">1. Spatial Grid Warp</text>
    <text x="340" y="185" fill="#fff" font-size="12" font-weight="semi-bold" text-anchor="middle">Phase Displacement Attack</text>
    <text x="340" y="210" fill="#8fa0b5" font-size="11" text-anchor="middle">Method: Lanczos-4 Windowed Sinc</text>
    <text x="340" y="235" fill="#8fa0b5" font-size="11" text-anchor="middle">Vector: θ = 0.15° Micro-Rotation</text>
    <text x="340" y="265" fill="#50677f" font-size="10.5" font-style="italic" text-anchor="middle">Breaks Absolute Grid Alignment</text>
  </g>

  <g>
    <rect x="550" y="125" width="260" height="170" rx="12" fill="#111520" stroke="url(#purple-pink)" stroke-width="2.5"/>
    <rect x="550" y="125" width="260" height="35" rx="12" fill="url(#purple-pink)" opacity="0.15"/>
    <text x="680" y="148" fill="#b180ff" font-size="14" font-weight="bold" text-anchor="middle">2. Latent Relaxation</text>
    <text x="680" y="185" fill="#fff" font-size="12" font-weight="semi-bold" text-anchor="middle">Neural Texture Remaking</text>
    <text x="680" y="210" fill="#8fa0b5" font-size="11" text-anchor="middle">Model: Runway Stable Diffusion 1.5</text>
    <text x="680" y="235" fill="#8fa0b5" font-size="11" text-anchor="middle">Solver: DPM++ Multistep (Karras)</text>
    <text x="680" y="265" fill="#50677f" font-size="10.5" font-style="italic" text-anchor="middle">Dissolves Deep Semantic Signatures</text>
  </g>

  <g>
    <rect x="890" y="125" width="260" height="170" rx="12" fill="#111520" stroke="url(#pink-orange)" stroke-width="2.5"/>
    <rect x="890" y="125" width="260" height="35" rx="12" fill="url(#pink-orange)" opacity="0.15"/>
    <text x="1020" y="148" fill="#ff7ec3" font-size="14" font-weight="bold" text-anchor="middle">3. Fractal Annihilation</text>
    <text x="1020" y="185" fill="#fff" font-size="12" font-weight="semi-bold" text-anchor="middle">Color Depth &amp; Shift Attack</text>
    <text x="1020" y="210" fill="#8fa0b5" font-size="11" text-anchor="middle">Quantization: Floyd-Steinberg Dither</text>
    <text x="1020" y="235" fill="#8fa0b5" font-size="11" text-anchor="middle">Perturbation: Sub-pixel 0.5px Jitter</text>
    <text x="1020" y="265" fill="#50677f" font-size="10.5" font-style="italic" text-anchor="middle">Obliterates Micro-Color Deviations</text>
  </g>

  <g>
    <circle cx="1250" cy="210" r="40" fill="#111520" stroke="#ff5fa2" stroke-width="2.5"/>
    <text x="1250" y="214" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">OUTPUT</text>
    <text x="1250" y="270" fill="#50677f" font-size="11" text-anchor="middle">Verified PNG</text>
  </g>
</svg>
